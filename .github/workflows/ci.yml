name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade "pip>=26.2" && pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (ruff)
        run: ruff format --check src/ tests/

      - name: Run tests
        run: pytest -v

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install project and pip-audit
        run: |
          python -m pip install --upgrade "pip>=26.2"
          pip install .
          pip install pip-audit

      - name: Audit dependencies
        run: pip-audit

  vm-install:
    name: Ubuntu private-tunnel deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install the exact revision and validate systemd units
        run: sudo bash deploy/aws/install.sh "${{ github.sha }}"
      - name: Verify real HTTP reads and backup under service restrictions
        run: |
          sudo systemctl start career-search.service
          for attempt in $(seq 1 15); do
            if /opt/career-search/venv/bin/python deploy/aws/verify_readonly.py; then
              break
            fi
            sleep 2
          done
          /opt/career-search/venv/bin/python deploy/aws/verify_readonly.py
          sudo systemctl start career-backup.service
          sudo systemctl is-active career-search.service
          sudo systemctl show career-backup.service --property=Result --property=ExecMainStatus
          # No tunnel credential is present and no provider discovery runs in this job.
          test "$(sudo systemctl is-enabled career-tunnel.service)" = disabled
          test "$(sudo systemctl is-enabled career-watcher.timer)" = disabled
      - name: Deployment service diagnostics on failure
        if: failure()
        run: sudo journalctl -u career-search.service -u career-backup.service --no-pager -n 80
