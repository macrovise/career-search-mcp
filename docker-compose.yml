services:
  career-mcp:
    build: .
    ports: ["127.0.0.1:8383:8383"]
    env_file: ${CAREER_ENV_FILE:-.env}
    environment:
      MCP_HOST: 0.0.0.0
      CAREER_AUTH_MODE: oauth
      CAREER_DB_PATH: /data/career.sqlite3
    user: "1000:1000"
    volumes: ["career-data:/data"]
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    networks: [career]
  career-watcher:
    build: .
    command: ["career-watcher"]
    env_file: ${CAREER_ENV_FILE:-.env}
    environment:
      CAREER_DB_PATH: /data/career.sqlite3
    user: "1000:1000"
    volumes: ["career-data:/data"]
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    networks: [career]
networks:
  career: {}
volumes:
  career-data: {}
