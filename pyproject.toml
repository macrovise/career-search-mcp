[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-search-mcp"
version = "3.0.0"
description = "Multi-source job search MCP server — aggregation, enrichment, fit scoring, and resume tailoring"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "fastmcp", "jobsearch", "jobs", "resume", "ats", "homelab", "forge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=3.4.7,<4",
    "httpx>=0.28,<1",
    "feedparser>=6,<7",
    "python-dotenv>=1,<2",
    "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21,<1.0",
    "ruff==0.16.0",
]

[project.scripts]
career-search-mcp = "jobsearch_mcp.server:main"
career-watcher = "jobsearch_mcp.job_watcher:main"
career-backup = "jobsearch_mcp.backup:main"

[project.urls]
Homepage = "https://github.com/macrovise/career-search-mcp"
Repository = "https://github.com/macrovise/career-search-mcp"
Changelog = "https://github.com/macrovise/career-search-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/jobsearch_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Explicit fleet-standard rule set (matches doc-cache-mcp / task-queue-mcp / vikunja-mcp).
# Pinned so ruff's expanding default select can't leak new rules in on upgrade.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
